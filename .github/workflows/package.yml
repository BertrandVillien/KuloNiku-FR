name: Paquets autonomes

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  package:
    strategy:
      matrix:
        include:
          - os: macos-latest
            platform: macOS
            package: macOS-Apple-Silicon
            architecture: arm64
            executable: KuloNiku-FR
            icon: KuloNikuFR.icns
          - os: macos-15-intel
            platform: macOS
            package: macOS-Intel
            architecture: x86_64
            executable: KuloNiku-FR
            icon: KuloNikuFR.icns
          - os: windows-latest
            platform: Windows
            package: Windows-x64
            architecture: x86_64
            executable: KuloNiku-FR.exe
            icon: KuloNikuFR.ico
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install uv
      - run: uv sync --locked --no-dev --group package
      - run: uv run --locked --no-dev --group package pyinstaller --clean --onefile --collect-all UnityPy --icon "packaging/icons/${{ matrix.icon }}" --name KuloNiku-FR packaging/entrypoint.py
      - if: matrix.platform == 'Windows'
        shell: pwsh
        run: uv run --locked --no-dev --group package pyinstaller --clean --onefile --windowed --icon "packaging/icons/KuloNikuFR.ico" --name "Installer KuloNiku FR" packaging/windows_entrypoint.py
      - shell: bash
        run: |
          mkdir -p package
          if [[ "${{ matrix.platform }}" == "Windows" ]]; then
            uv run --locked --no-dev --group package python packaging/create_update_manifest.py
            mkdir -p "package/resources/translations"
            cp "dist/${{ matrix.executable }}" package/resources/
            cp "dist/Installer KuloNiku FR.exe" package/
            cp "packaging/icons/KuloNikuFR.ico" package/resources/
            cp translations/fr.csv translations/source-hashes.csv translations/demo-overrides.csv translations/known-sources.json package/resources/translations/
            cp translations/NOTICE.md package/resources/translations/
            cp README.md package/
            cp LICENSE SECURITY.md THIRD_PARTY_NOTICES.md package/resources/
            "package/Installer KuloNiku FR.exe" --self-test
            cd package
            7z a -tzip "KuloNiku-FR-${{ matrix.package }}.zip" \
              "Installer KuloNiku FR.exe" \
              README.md \
              resources
          else
            chmod +x "dist/${{ matrix.executable }}"
            lipo "dist/${{ matrix.executable }}" -verify_arch "${{ matrix.architecture }}"
          fi
      - if: matrix.platform == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: KuloNiku-FR-${{ matrix.package }}
          path: package/KuloNiku-FR-${{ matrix.package }}.*
      - if: matrix.platform == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: KuloNiku-FR-engine-${{ matrix.package }}
          path: dist/${{ matrix.executable }}
      - if: matrix.platform == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: KuloNiku-FR-release-data
          path: |
            package/translations.zip
            package/update-manifest.json

  package-macos-universal:
    needs: package
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: KuloNiku-FR-engine-macOS-Apple-Silicon
          path: build/engines/arm64
      - uses: actions/download-artifact@v4
        with:
          name: KuloNiku-FR-engine-macOS-Intel
          path: build/engines/x86_64
      - shell: bash
        run: |
          if ! arch -x86_64 /usr/bin/true 2>/dev/null; then
            sudo softwareupdate --install-rosetta --agree-to-license
          fi
          chmod +x build/engines/arm64/KuloNiku-FR build/engines/x86_64/KuloNiku-FR
          lipo build/engines/arm64/KuloNiku-FR -verify_arch arm64
          lipo build/engines/x86_64/KuloNiku-FR -verify_arch x86_64
          bash packaging/build_macos_universal_app.sh \
            build/engines/arm64/KuloNiku-FR \
            build/engines/x86_64/KuloNiku-FR \
            build/macos
          test -x "build/macos/KuloNiku FR.app/Contents/MacOS/KuloNiku FR"
          lipo "build/macos/KuloNiku FR.app/Contents/MacOS/KuloNiku FR" -verify_arch arm64 x86_64
          arch -arm64 "build/macos/KuloNiku FR.app/Contents/MacOS/KuloNiku FR" --self-test
          arch -x86_64 "build/macos/KuloNiku FR.app/Contents/MacOS/KuloNiku FR" --self-test
          codesign --verify --deep --strict "build/macos/KuloNiku FR.app"
          mkdir -p build/macos/dmg package
          ditto "build/macos/KuloNiku FR.app" "build/macos/dmg/KuloNiku FR.app"
          ln -s /Applications "build/macos/dmg/Applications"
          hdiutil create \
            -volname "KuloNiku FR" \
            -srcfolder build/macos/dmg \
            -ov \
            -format UDZO \
            package/KuloNiku-FR-macOS-Universal.dmg
      - uses: actions/upload-artifact@v7
        with:
          name: KuloNiku-FR-macOS-Universal
          path: package/KuloNiku-FR-macOS-Universal.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [package, package-macos-universal]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - shell: bash
        run: |
          mkdir release-files
          find artifacts -type f \( -name '*.dmg' -o -name '*.zip' -o -name 'update-manifest.json' \) -exec cp {} release-files/ \;
          cd release-files
          sha256sum *.dmg *.zip > SHA256SUMS.txt
          release_flags=(--generate-notes --verify-tag)
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "${GITHUB_REF_NAME}" "${release_flags[@]}" ./*
        env:
          GH_TOKEN: ${{ github.token }}
