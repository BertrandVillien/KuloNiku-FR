name: AppImage Steam Deck (test)

on:
  workflow_dispatch:
  push:
    branches:
      - codex/steam-deck-support

jobs:
  package-steam-deck:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Dépendances de fabrication
        run: |
          sudo apt-get update
          sudo apt-get install --yes libfuse2 python3-tk xvfb
          python -m pip install uv
          uv sync --locked --no-dev --group package
      - name: Moteur et interface Linux
        run: |
          uv run python -c 'from kuloniku_fr import __version__; assert __version__ == "1.3.0-beta.1"'
          uv run --locked --no-dev --group package pyinstaller \
            --clean --onefile --collect-all UnityPy \
            --name KuloNiku-FR packaging/entrypoint.py
          uv run --locked --no-dev --group package pyinstaller \
            --clean --onefile --windowed \
            --name KuloNiku-FR-GUI packaging/linux_entrypoint.py
          file dist/KuloNiku-FR dist/KuloNiku-FR-GUI | grep --quiet 'x86-64'
      - name: Outil AppImage vérifié
        env:
          APPIMAGETOOL_SHA256: b90f4a8b18967545fda78a445b27680a1642f1ef9488ced28b65398f2be7add2
        run: |
          curl --fail --location --retry 3 \
            --output build/appimagetool-x86_64.AppImage \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          echo "$APPIMAGETOOL_SHA256  build/appimagetool-x86_64.AppImage" | sha256sum --check --strict
          chmod +x build/appimagetool-x86_64.AppImage packaging/build_steam_deck_appimage.sh
      - name: AppImage autonome
        run: |
          packaging/build_steam_deck_appimage.sh \
            dist/KuloNiku-FR \
            dist/KuloNiku-FR-GUI \
            build/appimagetool-x86_64.AppImage \
            package
      - name: Auto-test graphique sans écran
        run: |
          file package/KuloNiku-FR-Steam-Deck-x86_64.AppImage | grep --quiet 'x86-64'
          xvfb-run --auto-servernum \
            package/KuloNiku-FR-Steam-Deck-x86_64.AppImage \
            --appimage-extract-and-run --self-test
      - uses: actions/upload-artifact@v4
        with:
          name: KuloNiku-FR-Steam-Deck-x86_64
          retention-days: 14
          path: |
            package/KuloNiku-FR-Steam-Deck-x86_64.AppImage
            package/KuloNiku-FR-Steam-Deck-x86_64.AppImage.sha256
