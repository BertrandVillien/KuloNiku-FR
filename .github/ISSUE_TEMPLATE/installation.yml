name: Problème d’installation ou de restauration
description: Signaler un échec de KuloNiku FR sur macOS, Windows ou Steam Deck.
title: "[Installation] "
labels: ["installation", "à diagnostiquer"]
body:
  - type: dropdown
    id: platform
    attributes:
      label: Plateforme
      options: [macOS, Windows, Steam Deck]
    validations:
      required: true
  - type: dropdown
    id: edition
    attributes:
      label: Version du jeu
      options: [Jeu complet, Démo 0.10.5, Je ne sais pas]
    validations:
      required: true
  - type: input
    id: patcher
    attributes:
      label: Version de KuloNiku FR
      placeholder: "Exemple : 1.3.0-beta.1"
    validations:
      required: true
  - type: dropdown
    id: action
    attributes:
      label: Action en échec
      options: [Ouverture de l’application, Détection du jeu, Simulation, Installation, Lancement depuis Steam, Restauration, Vérification de mise à jour]
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Message affiché
      description: Copiez le message en masquant votre nom et vos chemins personnels.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Résultat attendu et résultat obtenu
    validations:
      required: true
  - type: input
    id: storage
    attributes:
      label: Emplacement du jeu
      description: Pour Steam Deck, indiquez stockage interne, carte microSD ou dossier choisi manuellement.
      placeholder: "Exemple : carte microSD"
  - type: textarea
    id: screenshot
    attributes:
      label: Capture facultative
      description: Glissez une capture recadrée et sans donnée personnelle.
  - type: checkboxes
    id: safety
    attributes:
      label: Sécurité
      options:
        - label: Je n’ai joint ni fichier du jeu, ni sauvegarde, ni donnée personnelle.
          required: true
